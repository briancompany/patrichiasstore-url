name: Deploy Patrichia AI chat Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/ai-chat/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-ai-chat
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ai-chat to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ai-chat Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          supabase functions deploy ai-chat --project-ref jkdxlbkckpwzmhdaoaoo --use-api --yes
