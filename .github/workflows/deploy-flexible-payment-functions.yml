name: Deploy flexible payment Edge Functions

on:
  push:
    branches:
      - feat/flexible-payment-checkout
    paths:
      - ".github/workflows/deploy-flexible-payment-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-flexible-payment-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy payment functions to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check out payment implementation
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy updated Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          supabase functions deploy process-payment-tasks --project-ref jkdxlbkckpwzmhdaoaoo --use-api --yes
          supabase functions deploy confirm-payment --project-ref jkdxlbkckpwzmhdaoaoo --use-api --yes
          supabase functions deploy pesapal-ipn --project-ref jkdxlbkckpwzmhdaoaoo --use-api --yes
          supabase functions deploy pesapal-status --project-ref jkdxlbkckpwzmhdaoaoo --use-api --yes
          supabase functions deploy send-delivery-update --project-ref jkdxlbkckpwzmhdaoaoo --use-api --yes
