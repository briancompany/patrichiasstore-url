name: SEO prerender build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build app and prerender SEO pages
        run: npm run build
